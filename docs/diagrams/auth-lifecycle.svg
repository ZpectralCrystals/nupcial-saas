l="#fff"/><text x="1175" y="1083" text-anchor="middle" font-size="11" fill="#60685e">Volver a entrar</text><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="30" width="240" height="82" rx="5"/></g><text x="155" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Solicitar registro</text><text x="155" y="85" font-size="11" fill="#58645a" text-anchor="middle">Solo correo; respuesta genérica</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="30" width="240" height="82" rx="5"/></g><text x="455" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Rate limit</text><text x="455" y="85" font-size="11" fill="#58645a" text-anchor="middle">5 intentos / ventana</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="635" y="30" width="240" height="82" rx="15"/></g><text x="755" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Cuenta pendiente</text><text x="755" y="85" font-size="11" fill="#58645a" text-anchor="middle">Clave aleatoria inaccesible</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="935" y="30" width="240" height="82" rx="15"/></g><text x="1055" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Token de verificación</text><text x="1055" y="85" font-size="11" fill="#58645a" text-anchor="middle">Un uso · 24 horas</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="35" y="320" width="240" height="82" rx="5"/></g><text x="155" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Proveedor de email</text><text x="155" y="375" font-size="11" fill="#58645a" text-anchor="middle">Local devuelve URL; producción externo</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="320" width="240" height="82" rx="5"/></g><text x="455" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Abrir enlace + crear clave</text><text x="455" y="375" font-size="11" fill="#58645a" text-anchor="middle">12–128 caracteres</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="635" y="320" width="240" height="82" rx="15"/></g><text x="755" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Cuenta activa</text><text x="755" y="375" font-size="11" fill="#58645a" text-anchor="middle">Correo verificado</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="320" width="240" height="82" rx="5"/></g><text x="1055" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Iniciar sesión</text><text x="1055" y="375" font-size="11" fill="#58645a" text-anchor="middle">Error genérico + rate limit</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="35" y="610" width="240" height="82" rx="15"/></g><text x="155" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Sesión</text><text x="155" y="665" font-size="11" fill="#58645a" text-anchor="middle">Cookie firmada · 12 horas</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="610" width="240" height="82" rx="5"/></g><text x="455" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Cerrar sesión</text><text x="455" y="665" font-size="11" fill="#58645a" text-anchor="middle">Revoca sesión actual</text></g><g><g fill="#f9edcf" stroke="#a98232" stroke-width="1.2" ><path d="M655 610 H855 L875 651 L855 692 H655 L635 651 Z"/></g><text x="755" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">¿Vigente?</text><text x="755" y="665" font-size="11" fill="#58645a" text-anchor="middle">Expiración / cuenta activa</text></g><g><g fill="#faeeee" stroke="#b67b75" stroke-width="1.2" ><rect x="935" y="610" width="240" height="82" rx="5"/></g><text x="1055" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Acceso rechazado</text><text x="1055" y="665" font-size="11" fill="#58645a" text-anchor="middle">401 / reautenticar</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="900" width="240" height="82" rx="5"/></g><text x="155" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Olvidé mi clave</text><text x="155" y="955" font-size="11" fill="#58645a" text-anchor="middle">Respuesta no enumerable</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="335" y="900" width="240" height="82" rx="15"/></g><text x="455" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Token de reset</text><text x="455" y="955" font-size="11" fill="#58645a" text-anchor="middle">Un uso · 30 minutos</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="900" width="240" height="82" rx="5"/></g><text x="755" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Elegir clave nueva</text><text x="755" y="955" font-size="11" fill="#58645a" text-anchor="middle">Valida y actualiza hash</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="900" width="240" height="82" rx="5"/></g><text x="1055" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Revocar sesiones</text><text x="1055" y="955" font-size="11" fill="#58645a" text-anchor="middle">Todas las sesiones de la cuenta</text></g></svg>