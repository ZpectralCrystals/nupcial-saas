/text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="610" width="240" height="82" rx="5"/></g><text x="1055" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Exportar CSV</text><text x="1055" y="665" font-size="11" fill="#58645a" text-anchor="middle">Invitados, mesas y canciones</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="900" width="240" height="82" rx="5"/></g><text x="155" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Canciones</text><text x="155" y="955" font-size="11" fill="#58645a" text-anchor="middle">Panel → aprobar o rechazar</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="900" width="240" height="82" rx="5"/></g><text x="455" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Galería</text><text x="455" y="955" font-size="11" fill="#58645a" text-anchor="middle">Panel → activar y revisar fotos</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="900" width="240" height="82" rx="5"/></g><text x="755" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Configuración</text><text x="755" y="955" font-size="11" fill="#58645a" text-anchor="middle">Respaldar / restaurar JSON</text></g><g><g fill="#f9edcf" stroke="#a98232" stroke-width="1.2" ><path d="M955 900 H1155 L1175 941 L1155 982 H955 L935 941 Z"/></g><text x="1055" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Validar respaldo</text><text x="1055" y="955" font-size="11" fill="#58645a" text-anchor="middle">Confirmar reemplazo y guardar</text></g><g><g fill="#faeeee" stroke="#b67b75" stroke-width="1.2" ><rect x="335" y="465" width="240" height="82" rx="5"/></g><text x="455" y="497" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Corregir archivo</text><text x="455" y="520" font-size="11" fill="#58645a" text-ancho