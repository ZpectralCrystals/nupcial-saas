ct x="-22" y="869" width="94" height="20" fill="#fff"/><text x="25" y="883" text-anchor="middle" font-size="11" fill="#60685e">Abrir módulo</text><path d="M875 941 L935 941" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="30" width="240" height="82" rx="5"/></g><text x="155" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Panel del evento</text><text x="155" y="85" font-size="11" fill="#58645a" text-anchor="middle">Métricas y accesos rápidos</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="30" width="240" height="82" rx="5"/></g><text x="455" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Editor de invitación</text><text x="455" y="85" font-size="11" fill="#58645a" text-anchor="middle">Datos, tema, paleta, secciones</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="30" width="240" height="82" rx="5"/></g><text x="755" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Revisar invitación</text><text x="755" y="85" font-size="11" fill="#58645a" text-anchor="middle">Vista completa local</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="935" y="30" width="240" height="82" rx="15"/></g><text x="1055" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Guardar cambios</text><text x="1055" y="85" font-size="11" fill="#58645a" text-anchor="middle">Persistencia o aviso de error</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="320" width="240" height="82" rx="5"/></g><text x="155" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Invitados</text><text x="155" y="375" font-size="11" fill="#58645a" text-anchor="middle">Alta manual o importación CSV</text></g><g><g fill="#f9edcf" stroke="#a98232" stroke-width="1.2" ><p