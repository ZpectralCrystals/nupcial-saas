<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="svg-title svg-desc" font-family="Arial, sans-serif"><title id="svg-title">SaaS ejecutable y límites de producción</title><desc id="svg-desc">Un monolito multi-cuenta; servicios externos u operación cloud aún pendiente aparecen discontinuos.. Cuenta SaaS a Sesión revocable. Sesión revocable a API mismo origen. API mismo origen a PostgreSQL / archivo local. Invitado público a Invitación en servidor. Invitación en servidor a RSVP / canciones / galería. RSVP / canciones / galería a PostgreSQL / archivo local: Actualiza. RSVP / canciones / galería a Archivos adjuntos: Carga temporal. Identidad multi-cuenta a Sesión revocable: Cuenta. API mismo origen a Servicio de cobros externo: Entitlement / webhook firmado. API mismo origen a Cola de notificaciones: Pendiente. Cola de notificaciones a Email / WhatsApp automático</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#89938b"/></marker></defs><rect width="1200" height="790" fill="#fff"/><path d="M275 71 L335 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 71 L635 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M875 71 L935 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M275 361 L335 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 361 L635 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M755 320 L755 216 L1055 216 L1055 112" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="868.5" y="205" width="73" height="20" fill="#fff"/><text x="905" y="219" text-anchor="middle" font-size="11" fill="#60685e">Actualiza</text><path d="M875 361 L935 361" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" mar