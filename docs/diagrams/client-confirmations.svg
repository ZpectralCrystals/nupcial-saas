<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="svg-title svg-desc" font-family="Arial, sans-serif"><title id="svg-title">Medir, filtrar y exportar respuestas</title><desc id="svg-desc">La respuesta vigente produce asistentes nombrados; Confirmaciones ofrece métricas, consulta y exportación.. Confirmaciones a Métricas. Métricas a Buscar. Buscar a Filtrar y ordenar. Filtrar y ordenar a Detalle de respuesta. Confirmaciones a Exportar listas: Descargar. Confirmaciones a Desde Invitados: Corregir. Desde Invitados a Enviar al plano: Confirmó. Desde Invitados a Notificar corrección: Efecto externo</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#89938b"/></marker></defs><rect width="1200" height="650" fill="#fff"/><path d="M275 71 L335 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 71 L635 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M875 71 L935 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1055 112 L1055 216 L155 216 L155 320" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M35 71 L15 71 L15 361 L455 361 L455 320" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="-21.5" y="350" width="73" height="20" fill="#fff"/><text x="15" y="364" text-anchor="middle" font-size="11" fill="#60685e">Descargar</text><path d="M35 71 L15 71 L15 361 L755 361 L755 320" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="-18" y="350" width="66" height="20" fill="#fff"/><text x="15" y="364" text-anchor="middle" font-size="11" fill="#60685e">Corregir</text><path d="M875 361 L935 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="872" y="350" width="66" height="20" fill="#fff"/><text x="905" y="364" text-anchor="middle" font-size="11" fill="#60685e">Confirmó</text><path d="M755 402 L755 433.5 L1055 433.5 L1055 465" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="851" y="422.5" width="108" height="20" fill="#fff"/><text x="905" y="436.5" text-anchor="middle" font-size="11" fill="#60685e">Efecto externo</text><g><g fill="#e9f1f8" stroke="#64829d" stroke-width="1.2" ><rect x="35" y="30" width="240" height="82" rx="5"/></g><text x="155" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Confirmaciones</text><text x="155" y="85" font-size="11" fill="#58645a" text-anchor="middle">Asistentes / no asistentes</text></g><g><g fill="#e9f1f8" stroke="#64829d" stroke-width="1.2" ><rect x="335" y="30" width="240" height="82" rx="5"/></g><text x="455" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Métricas</text><text x="455" y="85" font-size="11" fill="#58645a" text-anchor="middle">Personas y respuestas</text></g><g><g fill="#e9f1f8" stroke="#64829d" stroke-width="1.2" ><rect x="635" y="30" width="240" height="82" rx="5"/></g><text x="755" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Buscar</text><text x="755" y="85" font-size="11" fill="#58645a" text-anchor="middle">Persona / contacto</text></g><g><g fill="#e9f1f8" stroke="#64829d" stroke-width="1.2" ><rect x="935" y="30" width="240" height="82" rx="5"/></g><text x="1055" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Filtrar y ordenar</text><text x="1055" y="85" font-size="11" fill="#58645a" text-anchor="middle">Tipo · estado · recientes</text></g><g><g fill="#e9f1f8" stroke="#64829d" stroke-width="1.2" ><rect x="35" y="320" width="240" height="82" rx="5"/></g><text x="155" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Detalle de respuesta</text><text x="155" y="375" font-size="11" fill="#58645a" text-anchor="middle">Grupo · 