<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1320" role="img" aria-labelledby="svg-title svg-desc" font-family="Arial, sans-serif"><title id="svg-title">Alta de cliente → evento 1:N → datos aislados</title><desc id="svg-desc">Flujo ejecutable del único SaaS. Discontinuo = operación externa o evolución pendiente.. Registro a Verificar correo. Verificar correo a Cuenta. Cuenta a Crear evento: 1:N propietario. Cuenta a Membresía adicional: 1:N membresías. Membresía adicional a Crear evento: N:1 evento. Login cuenta a Sesión revocable. Sesión revocable a Autorizar evento. Cuenta a Autorizar evento: Identidad. Membresía adicional a Autorizar evento: Rol. Autorizar evento a Repositorio aislado: ¿Pertenece?. Normalizar colecciones a Repositorio aislado. Repositorio aislado a Módulos cliente. Módulos cliente a Código de invitado. Código de invitado a RSVP. Crear evento a URL pública estable. URL pública estable a Resolver invitación. Resolver invitación a Proyección pública. Repositorio aislado a Pruebas A/B. Operación a Repositorio aislado: Observabilidad / protección</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#89938b"/></marker></defs><rect width="1200" height="1320" fill="#fff"/><path d="M275 71 L335 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 71 L635 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M875 71 L935 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="847.5" y="60" width="115" height="20" fill="#fff"/><text x="905" y="74" text-anchor="middle" font-size="11" fill="#60685e">1:N propietario</text><path d="M755 112 L755 288.5 L155 288.5 L155 465" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="401" y="277.5" width="108" height="20" fill="#fff"/><text x="455" y="291.5" text-anchor="middle" font-size="11" fill="#60685e">1:N membresías</text><path d="M155 465 L155 288.5 L1055 288.5 L1055 112" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="565" y="277.5" width="80" height="20" fill="#fff"/><text x="605" y="291.5" text-anchor="middle" font-size="11" fill="#60685e">N:1 evento</text><path d="M275 361 L335 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 361 L635 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M755 112 L755 216 L755 216 L755 320" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="718.5" y="205" width="73" height="20" fill="#fff"/><text x="755" y="219" text-anchor="middle" font-size="11" fill="#60685e">Identidad</text><path d="M155 465 L155 433.5 L755 433.5 L755 402" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="439.5" y="422.5" width="31" height="20" fill="#fff"/><text x="455" y="436.5" text-anchor="middle" font-size="11" fill="#60685e">Rol</text><path d="M875 361 L935 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="861.5" y="350" width="87" height="20" fill="#fff"/><text x="905" y="364" text-anchor="middle" font-size="11" fill="#60685e">¿Pertenece?</text><path d="M155 610 L155 506 L1055 506 L1055 402" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M1055 402 L1055 506 L1055 506 L1055 610" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M935 651 L575 651" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 651 L635 651" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1055 112 L1055 506 L155 506 L155 900" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M275 941 L335 941" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 941 L635 941" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1055 402 L1055 651 L1055 651 L1055 900" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M455 1190 L455 796 L1055 796 L1055 402" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="655.5" y="785" width="199" height="20" fill="#fff"/><text x="755" y="799" text-anchor="middle" font-size="11" fill="#60685e">Observabilidad / protección</text><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="30" width="240" height="82" rx="5"/></g><text x="155" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Registro</text><text x="155" y="85" font-size="11" fill="#58645a" text-anchor="middle">Alta autoservicio con rate limit</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="30" width="240" height="82" rx="5"/></g><text x="455" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Verificar correo</text><text x="455" y="85" font-size="11" fill="#58645a" text-anchor="middle">Token de un solo uso</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="635" y="30" width="240" height="82" rx="15"/></g><text x="755" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Cuenta</text><text x="755" y="85" font-size="11" fill="#58645a" text-anchor="middle">Identidad activa en PostgreSQL</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="935" y="30" width="240" height="82" rx="15"/></g><text x="1055" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Crear evento</text><text x="1055" y="85" font-size="11" fill="#58645a" text-anchor="middle">Cuenta 1:N eventos</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="320" width="240" height="82" rx="5"/></g><text x="155" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Login cuenta</text><text x="155" y="375" font-size="11" fill="#58645a" text-anchor="middle">Scrypt + errores genéricos</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="320" width="240" height="82" rx="5"/></g><text x="455" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Sesión revocable</text><text x="455" y="375" font-size="11" fill="#58645a" text-anchor="middle">Cookie firmada + expiración</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="320" width="240" height="82" rx="5"/></g><text x="755" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Autorizar evento</text><text x="755" y="375" font-size="11" fill="#58645a" text-anchor="middle">Owner/editor/viewer + event_id</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="935" y="320" width="240" height="82" rx="15"/></g><text x="1055" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Repositorio aislado</text><text x="1055" y="375" font-size="11" fill="#58645a" text-anchor="middle">Filtrar por account_id/event_id</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="35" y="465" width="240" height="82" rx="15"/></g><text x="155" y="497" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Membresía adicional</text><text x="155" y="520" font-size="11" fill="#58645a" text-anchor="middle">Cuenta N:M evento; editor/viewer</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="35" y="610" width="240" height="82" rx="5"/></g><text x="155" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Normalizar colecciones</text><text x="155" y="665" font-size="11" fill="#58645a" text-anchor="middle">JSONB → tablas por módulo</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="610" width="240" height="82" rx="5"/></g><text x="455" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Código de invitado</text><text x="455" y="665" font-size="11" fill="#58645a" text-anchor="middle">Aleatorio y ligado al evento</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="610" width="240" height="82" rx="5"/></g><text x="755" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">RSVP</text><text x="755" y="665" font-size="11" fill="#58645a" text-anchor="middle">Validado y guardado por slug</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="610" width="240" height="82" rx="5"/></g><text x="1055" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Módulos cliente</text><text x="1055" y="665" font-size="11" fill="#58645a" text-anchor="middle">Invitados, mesas, galería y música</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="900" width="240" height="82" rx="5"/></g><text x="155" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">URL pública estable</text><text x="155" y="955" font-size="11" fill="#58645a" text-anchor="middle">Slug aleatorio por evento</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="900" width="240" height="82" rx="5"/></g><text x="455" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Resolver invitación</text><text x="455" y="955" font-size="11" fill="#58645a" text-anchor="middle">Evento publicado + código opcional</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="900" width="240" height="82" rx="5"/></g><text x="755" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Proyección pública</text><text x="755" y="955" font-size="11" fill="#58645a" text-anchor="middle">Solo campos permitidos</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="900" width="240" height="82" rx="5"/></g><text x="1055" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Pruebas A/B</text><text x="1055" y="955" font-size="11" fill="#58645a" text-anchor="middle">Acceso cruzado debe fallar</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="335" y="1190" width="240" height="82" rx="5"/></g><text x="455" y="1222" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Operación</text><text x="455" y="1245" font-size="11" fill="#58645a" text-anchor="middle">Backup/restore, logs y límites compartidos</text></g></svg>