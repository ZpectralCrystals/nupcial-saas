<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" role="img" aria-labelledby="svg-title svg-desc" font-family="Arial, sans-serif"><title id="svg-title">Preferencia de plan, mock y contrato pendiente</title><desc id="svg-desc">Distingue lo que hoy es demostración de las reglas comerciales que todavía no se aplican.. Elegir plan a Preferencia en evento. Preferencia en evento a Funciones abiertas. Funciones abiertas a Cupos informativos. Elegir plan a Checkout mock opcional. Checkout mock opcional a Resultado ficticio. Resultado ficticio a Plan demo activo: Aprobado. Resultado ficticio a Sin cambio: Otro. Billing externo a Entitlement firmado. Entitlement firmado a Validar + deduplicar. Validar + deduplicar a Aplicar entitlement. Aplicar entitlement a Matriz de límites. Matriz de límites a Enforcement API + UI. Enforcement API + UI a Ampliar / renovar. Ampliar / renovar a Billing externo. Aplicar entitlement a Expirar / suspender</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#89938b"/></marker></defs><rect width="1200" height="1180" fill="#fff"/><path d="M275 71 L335 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 71 L635 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M875 71 L935 71" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M155 112 L155 216 L155 216 L155 320" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M275 361 L335 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 361 L635 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="572" y="350" width="66" height="20" fill="#fff"/><text x="605" y="364" text-anchor="middle" font-size="11" fill="#60685e">Aprobado</text><path d="M575 361 L935 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="736" y="350" width="38" height="20" fill="#fff"/><text x="755" y="364" text-anchor="middle" font-size="11" fill="#60685e">Otro</text><path d="M275 651 L335 651" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M575 651 L635 651" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M875 651 L935 651" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M1055 692 L1055 796 L155 796 L155 900" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M275 941 L335 941" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M575 941 L635 941" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M755 900 L755 796 L155 796 L155 692" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M1055 692 L1055 796 L1055 796 L1055 900" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="30" width="240" height="82" rx="5"/></g><text x="155" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Elegir plan</text><text x="155" y="85" font-size="11" fill="#58645a" text-anchor="middle">Essential · Premium · Deluxe</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="335" y="30" width="240" height="82" rx="15"/></g><text x="455" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Preferencia en evento</text><text x="455" y="85" font-size="11" fill="#58645a" text-anchor="middle">planStatus = demo</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="30" width="240" height="82" rx="5"/></g><text x="755" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Funciones abiertas</text><text x="755" y="85" font-size="11" fill="#58645a" text-anchor="middle">Panel completo para demostrar</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="935" y="30" width="240" height="82" rx="5"/></g><text x="1055" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Cupos informativos</text><text x="1055" y="85" font-size="11" fill="#58645a" text-anchor="middle">Uso visible; sin enforcement</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="320" width="240" height="82" rx="5"/></g><text x="155" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Checkout mock opcional</text><text x="155" y="375" font-size="11" fill="#58645a" text-anchor="middle">Precio calculado servidor</text></g><g><g fill="#f9edcf" stroke="#a98232" stroke-width="1.2" ><path d="M355 320 H555 L575 361 L555 402 H355 L335 361 Z"/></g><text x="455" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Resultado ficticio</text><text x="455" y="375" font-size="11" fill="#58645a" text-anchor="middle">pending · approved · rejected · cancelled</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="635" y="320" width="240" height="82" rx="15"/></g><text x="755" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Plan demo activo</text><text x="755" y="375" font-size="11" fill="#58645a" text-anchor="middle">Solo cambia campos del evento</text></g><g><g fill="#faeeee" stroke="#b67b75" stroke-width="1.2" ><rect x="935" y="320" width="240" height="82" rx="5"/></g><text x="1055" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Sin cambio</text><text x="1055" y="375" font-size="11" fill="#58645a" text-anchor="middle">Rechazo/cancel