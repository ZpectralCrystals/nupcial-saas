932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Enforcement API + UI</text><text x="455" y="955" font-size="11" fill="#58645a" text-anchor="middle">Bloquear sobrecupo de verdad</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="635" y="900" width="240" height="82" rx="5"/></g><text x="755" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Ampliar / renovar</text><text x="755" y="955" font-size="11" fill="#58645a" text-anchor="middle">Nuevo entitlement</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="935" y="900" width="240" height="82" rx="5"/></g><text x="1055" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Expirar / suspender</text><text x="1055" y="955" font-size="11" fill="#58645a" text-anchor="middle">Revocar cupos y funciones</text></g></svg>