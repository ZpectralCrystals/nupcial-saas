<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="svg-title svg-desc" font-family="Arial, sans-serif"><title id="svg-title">Compartir, revisar y descargar fotos</title><desc id="svg-desc">Capacidad, acceso de invitados, selección, eliminación y descargas visibles.. Galería interactiva a Cupo de fotos. Cupo de fotos a Compartir enlace. Compartir enlace a Código QR. Galería interactiva a Revisar fotos: Moderar. Revisar fotos a Seleccionar fotos. Seleccionar fotos a Descargar ZIP. Seleccionar fotos a Eliminar. Cupo de fotos a Ampliar cupo: Límite. Ampliar cupo a Pago / aumentar cupo</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#89938b"/></marker></defs><rect width="1200" height="720" fill="#fff"/><path d="M275 71 L335 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 71 L635 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M875 71 L935 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M35 71 L15 71 L15 361 L35 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="-14.5" y="205" width="59" height="20" fill="#fff"/><text x="15" y="219" text-anchor="middle" font-size="11" fill="#60685e">Moderar</text><path d="M275 361 L335 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 361 L635 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 361 L935 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M455 30 L455 71 L455 651 L455 610" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="429" y="350" width="52" height="20" fill="#fff"/><text x="455" y="364" text-anchor="middle" font-size="11" fill="#60685e">Límite</text><path d="M575 651 L635 651" fill