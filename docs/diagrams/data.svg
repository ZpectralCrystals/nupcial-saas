<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="svg-title svg-desc" font-family="Arial, sans-serif"><title id="svg-title">Qué información alimenta cada módulo</title><desc id="svg-desc">Estado sincronizado entre el panel autenticado y la invitación pública; almacenamiento PostgreSQL o archivo de desarrollo.. Diseño a Evento. Evento a Contenido de invitación. Evento a Invitados / grupos. Invitados / grupos a RSVP en invitado: Contiene. RSVP en invitado a Mesas: Referencia mesa. RSVP en invitado a Resumen y exportaciones: Cuenta asistentes. Evento a Canciones. Evento a Galería: Incluye. Galería a PostgreSQL / JSON local: Persiste. Canciones a PostgreSQL / JSON local: Persiste. Mesas a Objetos del salón: Ubicación del salón. Objetos del salón a PostgreSQL / JSON local: Respaldo JSON. Mesas a PostgreSQL / JSON local: Persiste. Evento a PostgreSQL / JSON local: API de estado. Contenido de invitación a Resumen y exportaciones: Vista previa. Evento a Vista pública: Proyección permitida. Invitados / grupos a Vista pública: Solo registro por código</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#89938b"/></marker></defs><rect width="1200" height="1000" fill="#fff"/><path d="M155 112 L155 216 L155 216 L155 320" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M155 320 L155 216 L455 216 L455 112" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M275 361 L335 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 361 L635 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="572" y="350" width="66" height="20" fill="#fff"/><text x="605" y="364" text-anchor="middle" font-size="11" fill="#60685e">Contiene</text><path d="M875 361 L935 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="847.5" y="350" width="115" height="20" fill="#fff"/><text x="905" y="364" text-anchor="middle" font-size="11" fill="#60685e">Referencia mesa</text><path d="M755 320 L755 216 L1055 216 L1055 112" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="840.5" y="205" width="129" height="20" fill="#fff"/><text x="905" y="219" text-anchor="middle" font-size="11" fill="#60685e">Cuenta asistentes</text><path d="M155 402 L155 506 L455 506 L455 610" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M155 402 L155 490 L755 490 L755 610" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="425.5" y="479" width="59" height="20" fill="#fff"/><text x="455" y="493" text-anchor="middle" font-size="11" fill="#60685e">Incluye</text><path d="M875 651 L935 651" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="872" y="640" width="66" height="20" fill="#fff"/><text x="905" y="654" text-anchor="middle" font-size="11" fill="#60685e">Persiste</text><path d="M455 692 L455 740 L1055 740 L1055 692" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="722" y="729" width="66" height="20" fill="#fff"/><text x="755" y="743" text-anchor="middle" font-size="11" fill="#60685e">Persiste</text><path d="M1055 402 L1055 433.5 L755 433.5 L755 465" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="833.5" y="422.5" width="143" height="20" fill="#fff"/><text x="905" y="436.5" text-anchor="middle" font-size="11" fill="#60685e">Ubicación del salón</text><path d="M755 547 L755 578.5 L1055 578.5 L1055 610" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="854.5" y="567.5" width="101" height="20" fill="#fff"/><text x="905" y="581.5" text-anchor="middle" font-size="11" fill="#60685e">Respaldo JSON</text><path d="M1055 402 L1055 506 L1055 506 L1055 610" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1022" y="495" width="66" height="20" fill="#fff"/><text x="1055" y="509" text-anchor="middle" font-size="11" fill="#60685e">Persiste</text><path d="M35 361 L15 361 L15 765 L1175 765 L1175 651 L1175 651" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="544.5" y="754" width="101" height="20" fill="#fff"/><text x="595" y="768" text-anchor="middle" font-size="11" fill="#60685e">API de estado</text><path d="M575 71 L935 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="708" y="60" width="94" height="20" fill="#fff"/><text x="755" y="74" text-anchor="middle" font-size="11" fill="#60685e">Vista previa</text><path d="M155 402 L155 651 L1055 651 L1055 900" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="530" y="640" width="150" height="20" fill="#fff"/><text x="605" y="654" text-anchor="middle" font-size="11" fill="#60685e">Proyección permitida</text><path d="M455 402 L455 651 L1055 651 L1055 900" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="666" y="640" width="178" height="20" fill="#fff"/><text x="755" y="654" text-anchor="middle" font-size="11" fill="#60685e">Solo registro por código</text><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="35" y="320" width="240" height="82" rx="15"/></g><text x="155" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Evento</text><text x="155" y="375" font-size="11" fill="#58645a" text-anchor="middle">Nombres, fecha, lugar y secciones</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="30" width="240" height="82" rx="5"/></g><text x="155" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Diseño</text><text x="155" y="85" font-size="11" fill="#58645a" text-anchor="middle">theme + palette + plan</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="30" width="240" height="82" rx="5"/></g><text x="455" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Contenido de invitación</text><text x="455" y="85" font-size="11" fill="#58645a" text-anchor="middle">Familia, itinerario, regalos, audio</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="335" y="320" width="240" height="82" rx="15"/></g><text x="455" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Invitados / grupos</text><text x="455" y="375" font-size="11" fill="#58645a" text-anchor="middle">id, código, pases y acompañantes</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="320" width="240" height="82" rx="5"/></g><text x="755" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">RSVP en invitado</text><text x="755" y="375" font-size="11" fill="#58645a" text-anchor="middle">status, confirmedCount, message</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="935" y="320" width="240" height="82" rx="15"/></g><text x="1055" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Mesas</text><text x="1055" y="375" font-size="11" fill="#58645a" text-anchor="middle">capacidad, forma y posición x/y</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="635" y="465" width="240" height="82" rx="15"/></g><text x="755" y="497" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Objetos del salón</text><text x="755" y="520" font-size="11" fill="#58645a" text-anchor="middle">Tipo + posición x/y</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="335" y="610" width="240" height="82" rx="15"/></g><text x="455" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Canciones</text><text x="455" y="665" font-size="11" fill="#58645a" text-anchor="middle">Título, artista, autor y estado</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="635" y="610" width="240" height="82" rx="15"/></g><text x="755" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Galería</text><text x="755" y="665" font-size="11" fill="#58645a" text-anchor="middle">Imagen, autor y habilitación</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="935" y="610" width="240" height="82" rx="15"/></g><text x="1055" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">PostgreSQL / JSON local</text><text x="1055" y="665" font-size="11" fill="#58645a" text-anchor="middle">Payload aislado por event_id</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="30" width="240" height="82" rx="5"/></g><text x="1055" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Resumen y exportaciones</text><text x="1055" y="85" font-size="11" fill="#58645a" text-anchor="middle">Lecturas derivadas de los datos</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="900" width="240" height="82" rx="5"/></g><text x="1055" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Vista pública</text><text x="1055" y="955" font-size="11" fill="#58645a" text-anchor="middle">Solo datos visibles + código invitado</text></g></svg>