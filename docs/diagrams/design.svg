<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="svg-title svg-desc" font-family="Arial, sans-serif"><title id="svg-title">El estilo no depende de una fotografía</title><desc id="svg-desc">Diseño = estructura + tipografía. Paleta = colores por función. Contenido = datos de cada evento.. Elegir modelo a Estructura del tema. Estructura del tema a Elegir paleta. Elegir paleta a Aplicar colores. Aplicar colores a Probar invitación: Se previsualiza. Vista móvil / escritorio a Probar invitación. Probar invitación a Elegir diseño. Elegir diseño a Guardar en evento. Guardar en evento a Componer invitación: Lee selección. Editar datos y secciones a Componer invitación. Componer invitación a Invitación del evento. Fotos y audio opcionales a Invitación del evento</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#89938b"/></marker></defs><rect width="1200" height="790" fill="#fff"/><path d="M275 71 L335 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 71 L635 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M875 71 L935 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1055 112 L1055 170 L455 170 L455 320" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="697.5" y="159" width="115" height="20" fill="#fff"/><text x="755" y="173" text-anchor="middle" font-size="11" fill="#60685e">Se previsualiza</text><path d="M275 361 L335 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 361 L635 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M875 361 L935 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1055 402 L1055 460 L455 460 L455 610" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="704.5" y="449" width="101" height="20" fill="#fff"/><text x="755" y="463" text-anchor="middle" font-size="11" fill="#60685e">Lee selección</text><path d="M275 651 L335 651" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 651 L635 651" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M935 651 L875 651" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="30" width="240" height="82" rx="5"/></g><text x="155" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Elegir modelo</text><text x="155" y="85" font-size="11" fill="#58645a" text-anchor="middle">Versalles · Terra · Classic</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="30" width="240" height="82" rx="5"/></g><text x="455" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Estructura del tema</text><text x="455" y="85" font-size="11" fill="#58645a" text-anchor="middle">Romántica · orgánica · editorial</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="30" width="240" height="82" rx="5"/></g><text x="755" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Elegir paleta</text><text x="755" y="85" font-size="11" fill="#58645a" text-anchor="middle">Una de 9 combinaciones</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="30" width="240" height="82" rx="5"/></g><text x="1055" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Aplicar colores</text><text x="1055" y="85" font-size="11" fill="#58645a" text-anchor="middle">Fondo · texto · principal · adorno</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="320" width="240" height="82" rx="5"/></g><text x="155" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Vista móvil / escritorio</text><text x="155" y="375" font-size="11" fill="#58645a" text-anchor="middle">Mismo contenido y selección</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="320" width="240" height="82" rx="5"/></g><text x="455" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Probar invitación</text><text x="455" y="375" font-size="11" fill="#58645a" text-anchor="middle">Abrir sobre y explorar secciones</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="320" width="240" height="82" rx="5"/></g><text x="755" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Elegir diseño</text><text x="755" y="375" font-size="11" fill="#58645a" text-anchor="middle">Conserva tema + paleta + plan</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="935" y="320" width="240" height="82" rx="15"/></g><text x="1055" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Guardar en evento</text><text x="1055" y="375" font-size="11" fill="#58645a" text-anchor="middle">event.theme + event.palette</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="610" width="240" height="82" rx="5"/></g><text x="155" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Editar datos y secciones</text><text x="155" y="665" font-size="11" fill="#58645a" text-anchor="middle">Nombres, fecha, lugares, familia</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="610" width="240" height="82" rx="5"/></g><text x="455" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Componer invitación</text><text x="455" y="665" font-size="11" fill="#58645a" text-anchor="middle">Tema + paleta + datos visibles</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="610" width="240" height="82" rx="5"/></g><text x="755" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Invitación del evento</text><text x="755" y="665" font-size="11" fill="#58645a" text-anchor="middle">Renderiza selección guardada</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="610" width="240" height="82" rx="5"/></g><text x="1055" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Fotos y audio opcionales</text><text x="1055" y="665" font-size="11" fill="#58645a" text-anchor="middle">Contenido, no estructura</text></g></svg>