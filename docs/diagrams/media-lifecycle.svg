<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" role="img" aria-labelledby="svg-title svg-desc" font-family="Arial, sans-serif"><title id="svg-title">Carga actual y moderación/almacenamiento objetivo</title><desc id="svg-desc">Validaciones locales existentes y frontera pendiente para operar fotos/audio con privacidad.. Carga invitado / cliente a Rate limit y sección. Rate limit y sección a Validar tipo, firma y tamaño: Permitido. Rate limit y sección a Rechazar carga: No. Validar tipo, firma y tamaño a Límite técnico: Válido. Validar tipo, firma y tamaño a Rechazar carga: No. Límite técnico a Base64 en payload: Actual. Límite técnico a Rechazar carga: Excede. Base64 en payload a Visible en invitación. Visible en invitación a Panel de galería. Panel de galería a Cola aprobar / rechazar: Objetivo. Carga invitado / cliente a Object storage privado: Producción. Object storage privado a Escaneo / cuarentena. Escaneo / cuarentena a Cola aprobar / rechazar. Cola aprobar / rechazar a URL firmada / CDN. URL firmada / CDN a Retención y borrado. Object storage privado a event_media</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#89938b"/></marker></defs><rect width="1200" height="1180" fill="#fff"/><path d="M275 71 L335 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 71 L635 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="568.5" y="60" width="73" height="20" fill="#fff"/><text x="605" y="74" text-anchor="middle" font-size="11" fill="#60685e">Permitido</text><path d="M455 112 L455 506 L455 506 L455 900" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="443" y="495" width="24" height="20" fill="#fff"/><text x="455" y="509" text-anchor="middle" font-size="11" fill="#60685e">No</text><path d="M875 71 L935 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="879" y="60" width="52" height="20" fill="#fff"/><text x="905" y="74" text-anchor="middle" font-size="11" fill="#60685e">Válido</text><path d="M755 112 L755 506 L455 506 L455 900" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="593" y="495" width="24" height="20" fill="#fff"/><text x="605" y="509" text-anchor="middle" font-size="11" fill="#60685e">No</text><path d="M1055 112 L1055 216 L155 216 L155 320" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="579" y="205" width="52" height="20" fill="#fff"/><text x="605" y="219" text-anchor="middle" font-size="11" fill="#60685e">Actual</text><path d="M1055 112 L1055 506 L455 506 L455 900" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="729" y="495" width="52" height="20" fill="#fff"/><text x="755" y="509" text-anchor="middle" font-size="11" fill="#60685e">Excede</text><path d="M275 361 L335 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 361 L635 361" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M875 361 L935 361" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="872" y="350" width="66" height="20" fill="#fff"/><text x="905" y="364" text-anchor="middle" font-size="11" fill="#60685e">Objetivo</text><path d="M155 112 L155 173 L155 651 L155 610" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="115" y="401" width="80" height="20" fill="#fff"/><text x="155" y="415" text-anchor="middle" font-size="11" fill="#60685e">Producción</text><path d="M275 651 L335 651" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M455 610 L455 506 L1055 506 L1055 402" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M1055 402 L1055 506 L755 506 L755 610" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M875 651 L935 651" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M155 692 L155 796 L755 796 L755 900" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="30" width="240" height="82" rx="5"/></g><text x="155" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Carga invitado / cliente</text><text x="155" y="85" font-size="11" fill="#58645a" text-anchor="middle">PNG · JPEG · WebP; audio editor</text></g><g><g fill="#f9edcf" stroke="#a98232" stroke-width="1.2" ><path d="M355 30 H555 L575 71 L555 112 H355 L335 71 Z"/></g><text x="455" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Rate limit y sección</text><text x="455" y="85" font-size="11" fill="#58645a" text-anchor="middle">Galería habilitada + abuso</text></g><g><g fill="#f9edcf" stroke="#a98232" stroke-width="1.2" ><path d="M655 30 H855 L875 71 L855 112 H655 L635 71 Z"/></g><text x="755" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Validar tipo, firma y tamaño</text><text x="755" y="85" font-size="11" fill="#58645a" text-anchor="middle">Imagen ≤ 2 MB</text></g><g><g fill="#f9edcf" stroke="#a98232" stroke-width="1.2" ><path d="M955 30 H1155 L1175 71 L1155 112 H955 L935 71 Z"/></g><text x="1055" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Límite técnico</text><text x="1055" y="85" font-size="11" fill="#58645a" text-anchor="middle">Galería ≤ 200 en API</text></g><g><g fill="#e9f0f6" stroke="#6d899c" stroke-width="1.2" ><rect x="35" y="320" width="240" height="82" rx="15"/></g><text x="155" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Base64 en payload</text><text x="155" y="375" font-size="11" fill="#58645a" text-anchor="middle">Implementación temporal</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="320" width="240" height="82" rx="5"/></g><text x="455" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Visible en invitación</text><text x="455" y="375" font-size="11" fill="#58645a" text-anchor="middle">Foto actual aparece sin premoderación</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="320" width="240" height="82" rx="5"/></g><text x="755" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Panel de galería</text><text x="755" y="375" font-size="11" fill="#58645a" text-anchor="middle">Seleccionar, ZIP y eliminar</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="935" y="320" width="240" height="82" rx="5"/></g><text x="1055" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Cola aprobar / rechazar</text><text x="1055" y="375" font-size="11" fill="#58645a" text-anchor="middle">Estado por foto</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="35" y="610" width="240" height="82" rx="5"/></g><text x="155" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Object storage privado</text><text x="155" y="665" font-size="11" fill="#58645a" text-anchor="middle">Binario fuera de PostgreSQL</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="335" y="610" width="240" height="82" rx="5"/></g><text x="455" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Escaneo / cuarentena</text><text x="455" y="665" font-size="11" fill="#58645a" text-anchor="middle">Tipo real y malware</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="635" y="610" width="240" height="82" rx="5"/></g><text x="755" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">URL firmada / CDN</text><text x="755" y="665" font-size="11" fill="#58645a" text-anchor="middle">Acceso temporal autorizado</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="935" y="610" width="240" height="82" rx="5"/></g><text x="1055" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Retención y borrado</text><text x="1055" y="665" font-size="11" fill="#58645a" text-anchor="middle">Cuotas, purge y auditoría</text></g><g><g fill="#faeeee" stroke="#b67b75" stroke-width="1.2" ><rect x="335" y="900" width="240" height="82" rx="5"/></g><text x="455" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Rechazar carga</text><text x="455" y="955" font-size="11" fill="#58645a" text-anchor="middle">400 / 403 / 413 / 429</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="635" y="900" width="240" height="82" rx="5"/></g><text x="755" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">event_media</text><text x="755" y="955" font-size="11" fill="#58645a" text-anchor="middle">Metadatos relacionales objetivo</text></g></svg>