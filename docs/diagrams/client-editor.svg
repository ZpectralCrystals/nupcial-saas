<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="svg-title svg-desc" font-family="Arial, sans-serif"><title id="svg-title">Editar y guardar la invitación</title><desc id="svg-desc">Siete apartados del editor. El guardado se ofrece por sección.. Mi invitación a 7 apartados. 7 apartados a Editar sección. Editar sección a Guardar / descartar. Guardar / descartar a Invitación publicada. 7 apartados a Límites visibles. Guardar / descartar a Errores de guardado. Invitación publicada a Previsualizar</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#89938b"/></marker></defs><rect width="1200" height="500" fill="#fff"/><path d="M275 71 L335 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 71 L635 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M875 71 L935 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1055 112 L1055 216 L755 216 L755 320" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M455 112 L455 216 L155 216 L155 320" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1055 112 L1055 216 L455 216 L455 320" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M875 361 L935 361" fill="none" stroke="#89938b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g><g fill="#e9f1f8" stroke="#64829d" stroke-width="1.2" ><rect x="35" y="30" width="240" height="82" rx="5"/></g><text x="155" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Mi invitación</text><text x="155" y="85" font-size="11" fill="#58645a" text-anchor="middle">Buscar o elegir apartado</text></g><g><g fill="#e9f1f8" stroke="#64829d" stroke-width="1.2" ><rect x="335" y="30" width="240" height="82" rx="5"/></g><text x="455" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">7 apartados</text><text x="455" y="85" font-size="11" fill="#58645a" text-anchor="middle">Evento · agenda · familia · extras</text></g><g><g fill="#e9f1f8" stroke="#64829d" stroke-width="1.2" ><rect x="635" y="30" width="240" height="82" rx="5"/></g><text x="755" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Editar sección</text><text x="755" y="85" font-size="11" fill="#58645a" text-anchor="middle">Formulario del apartado elegido</text></g><g><g fill="#e9f1f8" stroke="#64829d" stroke-width="1.2" ><rect x="935" y="30" width="240" height="82" rx="5"/></g><text x="1055" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Guardar / descartar</text><text x="1055" y="85" font-size="11" fill="#58645a" text-anchor="middle">Acción por sección</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="635" y="320" width="240" height="82" rx="5"/></g><text x="755" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Invitación publicada</text><text x="755" y="375" font-size="11" fill="#58645a" text-anchor="middle">Resultado no cotejado</text></g><g><g fill="#e9f1f8" stroke="#64829d" stroke-width="1.2" ><rect x="35" y="320" width="240" height="82" rx="5"/></g><text x="155" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Límites visibles</text><text x="155" y="375" font-size="11" fill="#58645a" text-anchor="middle">10 momentos · cargas de medios</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="335" y="320" width="240" height="82" rx="5"/></g><text x="455" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Errores de guardado</text><text x="455" y="375" font-size="11" fill="#58645a" text-anchor="middle">Red / validación no inspeccionados</text></g><g><g fill="#f5ece7" stroke="#ac7664" stroke-width="1.2" stroke-dasharray="5 4"><rect x="935" y="320" width="240" height="82" rx="5"/></g><text x="1055" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Previsualizar</text><text x="1055" y="375" font-size="11" fill="#58645a" text-anchor="middle">No cotejado contra cuenta</text></g></svg>