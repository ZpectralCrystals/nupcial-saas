<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" role="img" aria-labelledby="svg-title svg-desc" font-family="Arial, sans-serif"><title id="svg-title">Del primer vistazo a la celebración</title><desc id="svg-desc">Recorrido probado del SaaS: diseño, registro, evento aislado, panel, publicación y compra simulada opcional.. Inicio comercial a Catálogo de bodas. Catálogo de bodas a Probador interactivo. Probador interactivo a Configurar evento. Configurar evento a Registro / acceso: Crear cuenta o entrar. Registro / acceso a ¿Cuenta tiene eventos?. ¿Cuenta tiene eventos? a Evento nuevo limpio: No · crear evento. ¿Cuenta tiene eventos? a Elegir evento existente: Sí · seleccionar. Evento nuevo limpio a Panel del cliente: Abrir panel. Elegir evento existente a Panel del cliente: Abrir evento. Panel del cliente a Planes / checkout opcional: Opcional. Planes / checkout opcional a Panel del cliente: Volver / mock aprobado. Panel del cliente a Editor de invitación. Editor de invitación a Vista de invitación. Panel del cliente a Gestión de invitados: Organiza. Gestión de invitados a Respuestas y recuerdos: Revisa resultados. Vista de invitación a Publicar y compartir: Publicar. Publicar y compartir a Invitado: URL estable. Invitado a Respuestas y recuerdos: RSVP guardado</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#89938b"/></marker></defs><rect width="1200" height="1100" fill="#fff"/><path d="M275 71 L335 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M575 71 L635 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M875 71 L935 71" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1055 112 L1055 216 L155 216 L155 320" fill="none" stroke="#89938b" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="526.5" y="205" width="157" height="20" fill="#fff"/><text x="605