45a" text-anchor="middle">Mock local; billing aparte</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="610" width="240" height="82" rx="5"/></g><text x="155" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Elegir evento existente</text><text x="155" y="665" font-size="11" fill="#58645a" text-anchor="middle">No mezcla otras celebraciones</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="610" width="240" height="82" rx="5"/></g><text x="455" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Panel del cliente</text><text x="455" y="665" font-size="11" fill="#58645a" text-anchor="middle">Resumen del evento activo</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="610" width="240" height="82" rx="5"/></g><text x="755" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Editor de invitación</text><text x="755" y="665" font-size="11" fill="#58645a" text-anchor="middle">Secciones, textos y estilo</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="610" width="240" height="82" rx="5"/></g><text x="1055" y="642" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Vista de invitación</text><text x="1055" y="665" font-size="11" fill="#58645a" text-anchor="middle">Sobre + contenido + formularios</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="900" width="240" height="82" rx="5"/></g><text x="155" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Gestión de invitados</text><text x="155" y="955" font-size="11" fill="#58645a" text-anchor="middle">Grupos, CSV, pases y mesas</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="900" width="240" height="82" rx="5"/></g><text x="455" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Respuestas y recuerdos</text><text x="455" y="955" font-size="11" fill="#58645a" text-anchor="middle">RSVP, canciones y galería</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="900" width="240" height="82" rx="5"/></g><text x="755" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Publicar y compartir</text><text x="755" y="955" font-size="11" fill="#58645a" text-anchor="middle">Slug estable por evento</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="900" width="240" height="82" rx="5"/></g><text x="1055" y="932" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Invitado</text><text x="1055" y="955" font-size="11" fill="#58645a" text-anchor="middle">Abre enlace general o personal</text></g></svg>