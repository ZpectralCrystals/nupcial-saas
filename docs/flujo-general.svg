</g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="30" width="240" height="82" rx="5"/></g><text x="455" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Catálogo de bodas</text><text x="455" y="85" font-size="11" fill="#58645a" text-anchor="middle">Versalles · Terra · Classic</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="30" width="240" height="82" rx="5"/></g><text x="755" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Probador interactivo</text><text x="755" y="85" font-size="11" fill="#58645a" text-anchor="middle">9 paletas + vista móvil</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="935" y="30" width="240" height="82" rx="5"/></g><text x="1055" y="62" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Configurar evento</text><text x="1055" y="85" font-size="11" fill="#58645a" text-anchor="middle">Datos → estilo → resumen</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="35" y="320" width="240" height="82" rx="5"/></g><text x="155" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Acceso demo</text><text x="155" y="375" font-size="11" fill="#58645a" text-anchor="middle">Sesión del navegador</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="335" y="320" width="240" height="82" rx="5"/></g><text x="455" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Panel del cliente</text><text x="455" y="375" font-size="11" fill="#58645a" text-anchor="middle">Resumen del evento</text></g><g><g fill="#edf4ed" stroke="#78907b" stroke-width="1.2" ><rect x="635" y="320" width="240" height="82" rx="5"/></g><text x="755" y="352" font-size="15" font-weight="600" fill="#28352e" text-anchor="middle">Editor de invitación</text><text x="755" y="375" font-size="11" fill="#58645a" text-anchor="middle">Secciones, te